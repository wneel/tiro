name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build the app (ad hoc signature)
        run: make app SIGN_IDENTITY=-

      - name: Verify the bundle
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Tiro.app
          plutil -lint dist/Tiro.app/Contents/Info.plist dist/Tiro.app/Contents/Library/LaunchAgents/org.animalert.tiro.agent.plist
          lipo -info dist/Tiro.app/Contents/MacOS/Tiro
